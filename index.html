  <!-- Update launch links and text -->
  <script>
    function updateLaunchInfo() {
      // Find and replace ALL instances of "January 2026" with empty/live text
      const walker = document.createTreeWalker(
        document.body,
        NodeFilter.SHOW_TEXT,
        null,
        false
      );
      
      let node;
      while (node = walker.nextNode()) {
        if (node.nodeValue) {
          // Replace launch date text with live text
          node.nodeValue = node.nodeValue.replace(/Launching\s+January\s+2026/g, 'Available now on the App Store');
          node.nodeValue = node.nodeValue.replace(/Launching\s+November\s+2025/g, 'Available now on the App Store');
          node.nodeValue = node.nodeValue.replace(/January\s+2026/g, 'Available Now');
          node.nodeValue = node.nodeValue.replace(/EMDRise\s+is\s+launching\s+soon\.\s+Join\s+the\s+growing\s+community\s+ready\s+to\s+experience\s+the\s+power\s+of\s+professional\s+Self-Directed\s+EMDR\./gi, 'Join the growing community experiencing the power of professional Self-Directed EMDR.');
          node.nodeValue = node.nodeValue.replace(/EMDRise\s+is\s+launching\s+soon/gi, 'EMDRise is available now');
        }
      }
      
      const appStoreUrl = "https://apps.apple.com/us/app/emdrise/id6751441958";
      const appStoreBadgeImg = "https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83&releaseDate=1738281600";
      
      // Update badges to working links
      const badges = document.querySelectorAll('[data-testid="badge-coming-soon"], [data-testid="badge-coming-soon-cta"], .badge-coming-soon, .badge-coming-soon-cta');
      
      badges.forEach(function(badge) {
        if (badge) {
          // Replace content with official Apple badge image
          badge.innerHTML = `<img src="${appStoreBadgeImg}" alt="Download on the App Store" style="height: 40px; width: auto; display: block; cursor: pointer;">`;
          badge.style.background = "none";
          badge.style.padding = "0";
          badge.style.border = "none";
          badge.style.cursor = "pointer";
          badge.style.opacity = "1";
          badge.style.visibility = "visible";
          badge.style.display = "block";
          
          // Make it a link if it isn't one
          let link = badge.closest('a');
          if (!link) {
            link = document.createElement('a');
            link.href = appStoreUrl;
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.style.display = "inline-block";
            badge.parentNode.insertBefore(link, badge);
            link.appendChild(badge);
          } else {
            link.href = appStoreUrl;
          }
        }
      });

      // Remove the apology message if it exists
      const apology = document.querySelector('.delay-message');
      if (apology) apology.remove();
      
      // Add social media links to footer if not already present
      const footer = document.querySelector('footer');
      if (footer && !footer.querySelector('.social-media-links')) {
        const socialLinks = document.createElement('div');
        socialLinks.className = 'social-media-links';
        socialLinks.style.cssText = 'display: flex; gap: 16px; justify-content: center; align-items: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(0,0,0,0.1);';
        
        const instagramLink = document.createElement('a');
        instagramLink.href = 'https://www.instagram.com/emdrise?igsh=MXc3YmF3bW54aGI0OQ%3D%3D&utm_source=qr';
        instagramLink.target = '_blank';
        instagramLink.rel = 'noopener noreferrer';
        instagramLink.innerHTML = '<img src="https://upload.wikimedia.org/wikipedia/commons/e/e7/Instagram_logo_2016.svg" alt="Instagram" style="width: 32px; height: 32px; border-radius: 8px;">';
        instagramLink.style.cssText = 'display: flex; align-items: center; justify-content: center; transition: transform 0.2s;';
        instagramLink.onmouseover = () => instagramLink.style.transform = 'scale(1.1)';
        instagramLink.onmouseout = () => instagramLink.style.transform = 'scale(1)';
        instagramLink.title = 'Follow us on Instagram';
        
        const tiktokLink = document.createElement('a');
        tiktokLink.href = 'https://www.tiktok.com/@emdrise?_r=1&_t=ZN-94Uooh77knf';
        tiktokLink.target = '_blank';
        tiktokLink.rel = 'noopener noreferrer';
        tiktokLink.innerHTML = '<img src="https://upload.wikimedia.org/wikipedia/en/a/a9/TikTok_logo.svg" alt="TikTok" style="width: 32px; height: 32px; border-radius: 8px; background: black; padding: 2px;">';
        tiktokLink.style.cssText = 'display: flex; align-items: center; justify-content: center; transition: transform 0.2s;';
        tiktokLink.onmouseover = () => tiktokLink.style.transform = 'scale(1.1)';
        tiktokLink.onmouseout = () => tiktokLink.style.transform = 'scale(1)';
        tiktokLink.title = 'Follow us on TikTok';
        
        socialLinks.appendChild(instagramLink);
        socialLinks.appendChild(tiktokLink);
        footer.appendChild(socialLinks);
      }
    }
    
    // Run when DOM is ready and after React renders
    function runUpdates() {
      setTimeout(updateLaunchInfo, 100);
      setTimeout(updateLaunchInfo, 300);
      setTimeout(updateLaunchInfo, 600);
      setTimeout(updateLaunchInfo, 1000);
      setTimeout(updateLaunchInfo, 2000);
    }
    
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', runUpdates);
    } else {
      runUpdates();
    }
  </script>
