name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the React app
        run: npm run build

      - name: Copy the production build to the Pages root
        run: cp -R dist/public/. .

      - name: Commit and push the generated site
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add index.html assets
          if git diff --cached --quiet; then
            echo "The generated site is already up to date."
          else
            git commit -m "Deploy latest landing page build"
            git push
          fi